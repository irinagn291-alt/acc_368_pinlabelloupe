name: LabelLoupe
options:
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.1'
    CURRENT_PROJECT_VERSION: 3
    CODE_SIGN_STYLE: Automatic
targets:
  LabelLoupe:
    type: application
    platform: iOS
    sources:
    - LabelLoupe
    - Shared
    - SharedCatalog
    dependencies:
    - target: LabelLoupeWidget
      embed: true
    entitlements:
      path: LabelLoupe/App.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.labelloupe.journal
    info:
      path: LabelLoupe/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: PinlabelLoupe
        NSCameraUsageDescription: Scan a barcode with the camera to find its label in Open Food Facts.
        CFBundleURLTypes:
        - CFBundleURLSchemes:
          - labelloupe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.labelloupe.journal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
  LabelLoupeWidget:
    type: app-extension
    platform: iOS
    sources:
    - LabelLoupeWidget
    - Shared
    entitlements:
      path: LabelLoupeWidget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.labelloupe.journal
    info:
      path: LabelLoupeWidget/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Label archive
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.labelloupe.journal.widget
        TARGETED_DEVICE_FAMILY: 1,2
        SKIP_INSTALL: 'YES'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
  LabelLoupeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - LabelLoupeUITests
    dependencies:
    - target: LabelLoupe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.labelloupe.journal.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: LabelLoupe
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
  LabelLoupeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: LabelLoupe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        PRODUCT_BUNDLE_IDENTIFIER: app.labelloupe.journal.tests
schemes:
  LabelLoupe:
    build:
      targets:
        LabelLoupe: all
    test:
      targets:
      - LabelLoupeTests
      - LabelLoupeUITests
